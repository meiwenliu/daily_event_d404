{% extends "base.html" %}
{% block title %}提醒时间 · D404 值日看板{% endblock %}
{% block header %}提醒时间管理{% endblock %}
{% block sub %}设置页面展示与复制文案中的提醒时间（仅网页展示与复制，不自动发微信）。{% endblock %}
{% block content %}

<section class="panel">
  <div class="panel-head">
    <h2>周一到周五 · 值日提醒时间</h2>
    <button class="btn-ghost-admin" id="btnAddWeekday">+ 添加时间</button>
  </div>
  <div class="panel-body" id="weekdayTimes"></div>
</section>

<section class="panel">
  <div class="panel-head">
    <h2>周六 · 大扫除提醒</h2>
    <label class="sw-row"><input type="checkbox" class="cb" id="saturdayEnabled"><span class="sw"></span><span>启用周六大扫除</span></label>
  </div>
  <div class="panel-body" id="saturdayTimes"></div>
</section>

<section class="panel">
  <div class="panel-head"><h2>周日与倒计时</h2></div>
  <div class="panel-body">
    <label class="sw-row"><input type="checkbox" class="cb" id="showSunday"><span class="sw"></span><span>显示周日提醒（默认关闭）</span></label>
    <label class="sw-row"><input type="checkbox" class="cb" id="showCountdown"><span class="sw"></span><span>显示提醒倒计时</span></label>
    <div class="form-grid" style="margin-top:8px">
      <label class="field"><span>提醒前提示分钟数</span><input id="notifyLead" type="number" min="1" max="240"></label>
    </div>
  </div>
</section>

<div class="btn-row" style="margin-bottom:18px">
  <button class="btn-primary-admin" id="btnSaveReminders">保存提醒时间设置</button>
</div>

{% endblock %}
