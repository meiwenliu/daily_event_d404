<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 · D404 值日看板</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-admin">
  <div class="admin-topbar">
    <div class="admin-topbar-inner">
      <div class="admin-brand">
        <div class="mk">D404</div>
        <span>值日看板 · 管理后台</span>
      </div>
      <nav class="admin-nav" id="adminNav">
        <a data-tab="basic" class="active">基础设置</a>
        <a data-tab="duty">值日人员</a>
        <a data-tab="status">今日与覆盖</a>
        <a data-tab="holidays">节假日</a>
        <a data-tab="templates">消息模板</a>
        <a data-tab="io">导入导出</a>
        <a data-tab="deploy">部署</a>
        <a data-tab="security">安全</a>
      </nav>
      <div class="admin-top-actions">
        <a class="admin-viewlink" href="/" target="_blank">↗ 看板</a>
        <a class="admin-viewlink" href="/logout">退出</a>
      </div>
    </div>
  </div>

  <div class="admin-wrap">
    {% block content %}{% endblock %}
  </div>

  <div id="toast" class="toast-area"></div>
  <script src="{{ url_for('static', filename='admin.js') }}?v=4"></script>
</body>
</html>
