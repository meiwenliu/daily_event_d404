<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d9488">
  <title>D404 实验室值日看板</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page-public">
  <header class="pheader">
    <div class="pheader-top">
      <h1 class="pheader-title" id="labName">D404 实验室值日看板</h1>
      <a class="chip chip-ghost" href="/login">管理</a>
    </div>
    <div class="pheader-date">
      <span id="dateStr">—</span><span class="dot">·</span>
      <span id="weekdayStr">—</span><span class="dot">·</span>
      <span id="clockStr" class="clock">--:--:--</span>
    </div>
  </header>

  <main id="view" class="pview">
    <div class="loading">正在加载值日信息…</div>
  </main>

  <div id="toast" class="toast-area"></div>
  <script src="{{ url_for('static', filename='public.js') }}"></script>
</body>
</html>
